name: fleetopsdemo

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${FLEETOPS_TEST_SA_PASSWORD:?Create .env.demo with tools/start_demo.ps1}
    networks: [private]
    volumes: [demo_sql_data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  bootstrap:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.demo_setup", "bootstrap"]
    environment: &setup_env
      FLEETOPS_ENV: demo
      FLEETOPS_DATABASE_NAME: fleetops_demo_001
      FLEETOPS_SQL_SERVER: sqlserver
      FLEETOPS_TEST_SA_PASSWORD: ${FLEETOPS_TEST_SA_PASSWORD:?}
      FLEETOPS_DEMO_RUNTIME_PASSWORD: ${FLEETOPS_DEMO_RUNTIME_PASSWORD:?}
    depends_on:
      sqlserver:
        condition: service_healthy
    networks: [private]
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *setup_env
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks: [private]
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.demo_setup", "seed"]
    environment: *setup_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      FLEETOPS_ENV: demo
      FLEETOPS_DATABASE_NAME: fleetops_demo_001
      FLEETOPS_SQL_SERVER: sqlserver
      FLEETOPS_DEMO_RUNTIME_PASSWORD: ${FLEETOPS_DEMO_RUNTIME_PASSWORD:?}
      FLEETOPS_DEMO_SESSION_SECRET: ${FLEETOPS_DEMO_SESSION_SECRET:?}
      FLEETOPS_AI_MODEL: ${FLEETOPS_AI_MODEL:-gpt-5.4-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      seed:
        condition: service_completed_successfully
    networks: [private, frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
    restart: unless-stopped

networks:
  private:
    internal: true
  frontend:

volumes:
  demo_sql_data:
